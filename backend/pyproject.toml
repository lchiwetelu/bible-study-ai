[project]
name = "bible-study-ai"
version = "0.1.0"
description = "An offline-first AI-powered Bible study companion"
readme = "README.md"
authors = [
    { name = "Lynda Chiwetelu", email = "lchiwetelu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.165.0",
    "ollama>=0.6.3",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
bible-study-ai = "bible_study_ai:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
